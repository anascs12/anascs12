<svg xmlns="http://www.w3.org/2000/svg" width="228" height="48" viewBox="0 0 228 48" role="img" aria-label="Open today's smog forecast">
  <title>Open today's smog forecast</title>
  <style>.badge-bg{fill:#fff;stroke:#dfe3e9}.badge-fg{fill:#11151b}.badge-muted{fill:#667085}.badge-sep{stroke:#d2d8e0}.badge-icon{fill:none;stroke:#11151b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}@media(prefers-color-scheme:dark){.badge-bg{fill:#0b0f14;stroke:#303741}.badge-fg{fill:#f7f8fa}.badge-muted{fill:#949eac}.badge-sep{stroke:#49515c}.badge-icon{stroke:#f7f8fa}}</style>
  <rect class="badge-bg" x="1" y="1" width="226" height="46" rx="14"/>
  <g class="badge-icon" transform="translate(14 12)" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M7 15l3-4 3 2 4-5"/><path d="M8 22h8M12 19v3"/></g>
  <text class="badge-muted" x="48" y="18.5" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif" font-size="8.8" font-weight="700" letter-spacing="1.2">SMOG FORECAST</text>
  <text class="badge-fg" x="48" y="35.5" font-family="Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif" font-size="15.5" font-weight="720">Today's forecast</text>
</svg>
